<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body, #root { height: 100%; width: 100%; margin: 0; padding: 0; }
      body { background: #0a0a1a; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <title>TaxiGo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (tg) {
            tg.ready();
            tg.expand();
            window.__TG_INIT_DATA = tg.initData || '';
            window.__TG_INIT_DATA_UNSAFE = tg.initDataUnsafe || null;
            window.__TG_COLOR_SCHEME = tg.colorScheme || 'dark';
          } else {
            window.__TG_INIT_DATA = '';
            window.__TG_INIT_DATA_UNSAFE = null;
            window.__TG_COLOR_SCHEME = 'dark';
          }
        } catch(e) {
          window.__TG_INIT_DATA = '';
          window.__TG_INIT_DATA_UNSAFE = null;
          window.__TG_COLOR_SCHEME = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
