[service.backend]
root = "./backend"
builder = "nixpacks"
watchPatterns = ["backend/src/**"]

[service.backend.deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[service.frontend]
root = "./frontend"
builder = "dockerfile"
dockerfile = "./frontend/Dockerfile"
watchPatterns = ["frontend/src/**"]
